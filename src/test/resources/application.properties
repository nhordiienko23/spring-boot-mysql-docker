# База данных H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.liquibase.enabled=false

# --- НОВЫЕ СТРОКИ (ЗАГЛУШКИ ДЛЯ ТЕСТОВ) ---

# Фейковый секрет для JWT (должен быть достаточно длинным, иначе JJWT выдаст ошибку)
jwt.secret=dummy_secret_key_for_testing_purposes_only_123456789

# Фейковые ключи для OAuth2, чтобы Spring Security успешно собрал контекст
GOOGLE_CLIENT_ID=test-google-id
GOOGLE_CLIENT_SECRET=test-google-secret
GITHUB_CLIENT_ID=test-github-id
GITHUB_CLIENT_SECRET=test-github-secret